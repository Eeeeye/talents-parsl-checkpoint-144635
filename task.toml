schema_version = "1.1"

[task]
name = "talents/parsl-checkpoint-publication"
description = "Repair completion visibility, immutable deferred checkpoint publication, and collision-safe cross-run recovery in an offline Parsl HPC workflow launcher."
authors = []
keywords = ["python", "hpc", "parsl", "workflow", "checkpoint", "concurrency"]

[metadata]
difficulty = "hard"
category = "systems"
tags = ["debugging", "hpc", "concurrency", "persistence", "recovery", "offline"]
expert_time_estimate_min = 120.0
junior_time_estimate_min = 300.0
difficulty_explanation = """
L3: the Starter builds and runs but violates a user-visible completion boundary
across Future publication, memo/checkpoint state, terminal task-table cleanup,
deferred persistence, and numbered run discovery. Success, memo, terminal error,
dependency, and join paths finalize differently, so patching only the common
success path leaves observable races. Recovery must also distinguish None from an
explicit empty checkpoint list, snapshot mutable results before callers can alter
deferred state, atomically allocate run IDs across launcher processes, distinguish
ASCII run names from numeric lookalikes, order numeric run IDs, and reject
partially started pickle records without rejecting a clean EOF or creating empty
streams for ineligible outcomes. A complete repair therefore crosses several
asynchronous, filesystem, and persistence layers while preserving public APIs.
"""

[verifier]
timeout_sec = 240.0
user = "root"

[agent]
timeout_sec = 3600.0
user = "candidate"

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true
mcp_servers = []
workdir = "/workspace/parsl-checkpoint"

[environment.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/workspace/parsl-checkpoint"

[verifier.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/workspace/parsl-checkpoint"

[solution.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/workspace/parsl-checkpoint"
